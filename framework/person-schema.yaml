# Person profile schema: the conditioning input for predicting what someone feels, thinks, and does.
# Every field has: type, range/values, the instrument it comes from, how strongly it predicts affect or behavior
# (evidence: strong / moderate / weak / unknown), and what to do when it is missing.
#
# Design rule (from Park et al. 2024 and the persona-stereotyping literature): idiographic data about the
# specific person (their own words, history, and current goals) beats demographic categories. Demographics
# set weak priors; the knowledge, goals, and history blocks do most of the predictive work.

version: 0.2.0

sensitive_fields:
  description: Special-category and intimate attributes. Entered by the user or by the subject, never inferred by any model from text, photos, video, names, or other fields. Stored encrypted. Excluded from model inputs unless the user turns inference-input on for that person; even then they are inputs only, never outputs. Shown under a collapsed, locked section in the product.
  paths:
    - identity.sexual_orientation
    - identity.race
    - identity.ethnicity
    - identity.religion
    - identity.religiosity
    - identity.political_orientation
    - history.trauma
    - history.mental_health
    - social_context.chronic_illness_burden
    - constraints_and_rhythms.medications
    - constraints_and_rhythms.hormonal_context
    - physical.weight_band
    - physical.disability_and_mobility
    - physical.sensory_impairments
    - physical.visible_differences
    - biology
  rule: any extraction or prediction job must drop these paths from its proposal set

blocks:

  identity:
    description: Demographic and social-position facts. Weak-to-moderate predictors on their own; strong when they change what the person knows or has experienced.
    fields:
      full_name:
        type: string
        evidence: none
        note: display and matching to the user's own records only; never used as a predictor and never used to infer ancestry, gender, or any other field
      preferred_name:
        type: string
        evidence: none
      pronouns:
        type: string
        evidence: none
        note: self-described or as the person uses them; never inferred from the name
      date_of_birth:
        type: date
        evidence: moderate
        note: age is derived from this when present; birthdays feed reminders in the product
      age:            {type: int, range: [0, 110], evidence: moderate, note: positivity effect with age (Reed, Chan & Mikels 2014, 100 studies); shorter time horizon raises weight on present affect; missing -> population prior}
      sex:            {type: enum, values: [female, male, intersex, unknown], evidence: weak, note: meta-analytic d for emotion experience mostly < 0.3 (Else-Quest 2012; Chaplin & Aldao 2013); do not infer from name}
      gender:         {type: string, evidence: weak, note: social role effects on display rules; self-described}
      culture:        {type: string, evidence: moderate, note: nationality, ethnicity, region; shapes ideal affect (Tsai), appraisal norms (Mesquita), status signals, food norms, emotion vocabulary (Jackson 2019)}
      languages:      {type: "list[string]", evidence: moderate, note: gates culture_specific emotion ids in the ontology}
      religion:       {type: string, evidence: moderate}
      religiosity:    {type: float, range: [0, 1], evidence: moderate, note: attendance and salience; affects ideal affect (calm vs excited), purity/sanctity moral weight, disgust and guilt sensitivity; OpinionQA shows high-attendance groups are poorly modeled by default LLMs}
      socioeconomic:  {type: object, fields: {income_percentile: float, education: "enum[none, primary, secondary, some_college, bachelor, graduate]", occupation: string, wealth_security: float}, evidence: moderate, note: scarcity shortens time horizon and raises stress baseline}
      relationship_status: {type: enum, values: [single, partnered, married, separated, widowed], evidence: weak}
      parental_status:     {type: object, fields: {has_children: bool, ages: "list[int]"}, evidence: moderate, note: activates CARE drive strongly; overspending on dependents}
      residence:      {type: enum, values: [urban, suburban, rural], evidence: weak}
      political_orientation: {type: float, range: [-1, 1], evidence: moderate, note: correlates with moral foundation weights and disgust sensitivity}

      sexual_orientation:
        type: string
        sensitive: true
        entered_by: [user, subject]
        evidence: weak
        note: self-described text; no enum, so the field cannot become a classification target; never inferred
      race:
        type: "list[string]"
        sensitive: true
        entered_by: [user, subject]
        evidence: weak
        note: self-identified, multiple allowed; relevant to experiences of discrimination (social_context.chronic_strains) and homophily, not as a direct predictor of feeling; never inferred
      ethnicity:
        type: "list[string]"
        sensitive: true
        entered_by: [user, subject]
        evidence: moderate
        note: self-identified heritage and community; overlaps culture, which carries most of the predictive weight; never inferred

  personality:
    description: Stable trait dispositions. Neuroticism and extraversion are the best-replicated predictors of affect.
    fields:
      big_five:
        type: object
        fields: {openness: float, conscientiousness: float, extraversion: float, agreeableness: float, neuroticism: float}
        range: [0, 1]
        instrument: BFI-2 or IPIP-NEO
        evidence: strong
        note: neuroticism ~ .4 with negative affect; extraversion with positive affect and PLAY; agreeableness with CARE and reactivity to others' harm (Marengo 2021; Hengartner 2017; Anglim & Horwood 2020)
      big_five_facets:  {type: object, range: [0, 1], instrument: BFI-2 facets (15), evidence: moderate, note: optional refinement}
      hexaco_honesty_humility: {type: float, range: [0, 1], evidence: moderate, note: predicts greed, status display, fairness reactions}
      attachment_style: {type: object, fields: {anxiety: float, avoidance: float}, range: [0, 1], instrument: ECR-R, evidence: moderate, note: governs PANIC/GRIEF sensitivity, jealousy, reassurance seeking}
      emotion_regulation: {type: object, fields: {reappraisal: float, suppression: float, rumination: float, situation_selection: float}, range: [0, 1], instrument: ERQ, evidence: moderate, note: changes what is felt versus expressed}
      ideal_affect: {type: object, fields: {high_arousal_positive: float, low_arousal_positive: float}, range: [0, 1], instrument: AVI (Tsai), evidence: moderate, note: culture-shaped target state; drives activity and consumption choices}
      disgust_sensitivity: {type: object, fields: {pathogen: float, sexual: float, moral: float}, range: [0, 1], instrument: TDDS (Tybur), evidence: strong, note: predicts food neophobia, moral purity judgments, out-group attitudes}
      reward_sensitivity: {type: object, fields: {bas_drive: float, bas_reward_responsiveness: float, bas_fun_seeking: float, bis: float}, range: [0, 1], instrument: BIS/BAS, evidence: moderate, note: SEEKING gain and FEAR gain}
      interoceptive_awareness: {type: float, range: [0, 1], instrument: MAIA-2, evidence: weak, note: objective interoception measures disagree with each other; self-report only}
      risk_tolerance:  {type: float, range: [0, 1], instrument: DOSPERT, evidence: moderate}
      time_preference: {type: float, range: [0, 1], evidence: moderate, note: discount rate; interacts with scarcity and age}
      trust_propensity: {type: float, range: [0, 1], evidence: moderate}
      need_for_cognition: {type: float, range: [0, 1], evidence: moderate, note: probability that Type 2 intervenes}
      alexithymia:     {type: float, range: [0, 1], instrument: TAS-20, evidence: moderate, note: degrades the quality of self-reported feeling labels; raises weight on behavioral prediction over stated feeling}

  aptitudes:
    description: Abilities and skills. Shown as bands in the product, never as a single number. Text-based estimates have weak validity (order of r 0.3 to 0.4 at best); predictions are suppressed below about 30 percent profile coverage.
    fields:
      general_cognitive_band: {type: enum, values: [below_average, average, above_average, well_above, unknown], evidence: weak, note: optional numeric range behind a disclosure; never predicted for minors}
      verbal:        {type: float, range: [0, 1], evidence: weak, note: vocabulary and argument structure in the person's own messages are the main signal}
      quantitative:  {type: float, range: [0, 1], evidence: weak}
      spatial:       {type: float, range: [0, 1], evidence: weak}
      social_emotional: {type: float, range: [0, 1], evidence: moderate, note: observable in notes about how they handle people}
      creative:      {type: float, range: [0, 1], evidence: weak}
      practical_mechanical: {type: float, range: [0, 1], evidence: weak}
      notable_skills: {type: "list[string]", evidence: strong when observed, note: languages, instruments, sports, crafts, tools}
      career_stage:  {type: enum, values: [student, early, mid, senior, leadership, retired, unknown], evidence: moderate}
      field:         {type: string, evidence: moderate}
      working_toward: {type: string, evidence: moderate, note: mirrors goals.active_goals for the summary card}

  values_and_morals:
    description: What the person treats as good. Predicts moral emotions, condemnation, pride, guilt, and which norm violations register.
    fields:
      schwartz_values: {type: object, fields: {self_direction_thought: float, self_direction_action: float, stimulation: float, hedonism: float, achievement: float, power_dominance: float, power_resources: float, face: float, security_personal: float, security_societal: float, tradition: float, conformity_rules: float, conformity_interpersonal: float, humility: float, benevolence_dependability: float, benevolence_caring: float, universalism_concern: float, universalism_nature: float, universalism_tolerance: float}, range: [0, 1], instrument: PVQ-RR (19 refined values), evidence: strong for value-relevant choices}
      moral_foundations: {type: object, fields: {care: float, equality: float, proportionality: float, loyalty: float, authority: float, purity: float}, range: [0, 1], instrument: MFQ-2 (Atari 2023; omega .79-.92), evidence: moderate, note: six-factor structure replicates; second-order structure does not}
      explicit_principles: {type: "list[string]", evidence: moderate, note: stated rules in the person's own words ("never waste food")}
      taboos: {type: "list[string]", evidence: strong when present}

  history:
    description: Where the person's priors came from. The strongest block after knowledge and goals.
    fields:
      upbringing: {type: object, fields: {parenting_style: "enum[authoritative, authoritarian, permissive, neglectful, unknown]", household_stability: float, siblings: int, birth_order: int, childhood_ses: float, adverse_childhood_experiences: int}, evidence: moderate for ACEs and stability; weak for birth order}
      formative_events: {type: "list[object]", item: {description: string, age: int, valence: float, domain: string}, evidence: strong, note: free text; the single most useful field per Park et al. 2024 interview-based agents}
      expertise_domains: {type: "list[object]", item: {domain: string, years: float, feedback_quality: "enum[kind, wicked]"}, evidence: strong, note: Kahneman & Klein; intuition reliability is domain-specific}
      habits: {type: "list[object]", item: {context_cue: string, action: string, frequency_per_week: float}, evidence: strong for the matching context}
      cue_history: {type: "list[object]", item: {cue: string, paired_outcome: string, valence: float, count: int}, evidence: strong for the matching cue, note: wanting attaches to cues}
      relationship_history: {type: "list[object]", item: {role: string, quality: float, ended: bool}, evidence: moderate}
      trauma: {type: "list[string]", evidence: strong for matching triggers}
      mental_health: {type: "list[string]", evidence: strong, note: diagnoses or self-described; shifts baseline affect and appraisal biases}

  state:
    description: The Intuition Stack's L0 at the moment of the situation. Changes predictions more than most trait fields and is usually missing; always predict it when absent.
    fields:
      hours_since_meal: {type: float, evidence: strong for irritability, impulsivity, food choice}
      sleep_hours_last_night: {type: float, evidence: strong}
      caffeine_alcohol_other: {type: "list[string]", evidence: strong}
      illness_pain: {type: float, range: [0, 1], evidence: strong}
      stress_load: {type: float, range: [0, 1], evidence: strong}
      recent_arousal_source: {type: string, evidence: moderate, note: misattribution}
      baseline_mood: {type: object, fields: {valence: float, arousal: float}, range: [0, 1], evidence: strong}
      time_of_day: {type: string, evidence: weak}
      recent_drive_deprivation: {type: "list[enum[SEEKING, FEAR, RAGE, LUST, CARE, PANIC_GRIEF, PLAY, DISGUST]]", evidence: moderate}

  knowledge:
    description: What the person knows and believes about the situation. The theory-of-mind block. Without it, no model can predict a reaction to information.
    fields:
      beliefs_about_situation: {type: "list[string]", evidence: strong, note: including false beliefs; FANToM and OpenToM failures are mostly here}
      knows_facts: {type: "list[string]", evidence: strong}
      does_not_know: {type: "list[string]", evidence: strong}
      expectations: {type: "list[object]", item: {about: string, expected: string, confidence: float}, evidence: strong, note: prediction error source}
      attention_focus: {type: string, evidence: moderate}

  goals:
    description: Active goals and concerns. Appraisal of goal conduciveness requires them.
    fields:
      active_goals: {type: "list[object]", item: {goal: string, importance: float, progress: float}, evidence: strong}
      concerns: {type: "list[string]", evidence: strong}
      identity_commitments: {type: "list[string]", evidence: moderate, note: what they would be ashamed to violate}

  relations:
    description: The person's relationship to every other actor in the situation.
    fields:
      actors: {type: "list[object]", item: {name: string, role: string, closeness: float, trust: float, status_relative: float, similarity_perceived: float, exposure_count: int, reciprocity_signals: float, history_valence: float}, evidence: strong, note: the L3 drivers}
      audience: {type: "list[string]", evidence: strong, note: who can observe the behavior; changes status and shame computations}

  social_context:
    description: Social position, chronic strain, and rule-breaking context. From medical sociology (Pearlin stress process; Cockerham health lifestyles) and criminology (routine activity, strain, social learning, self-control, life course). Sets the baseline of L0 and the priors for norm violation.
    fields:
      chronic_strains:       {type: "list[string]", evidence: strong, note: role strain, financial strain, caregiving, discrimination; standing load on the body budget}
      coping_resources:      {type: object, fields: {mastery: float, self_esteem: float}, range: [0, 1], evidence: moderate}
      social_support:        {type: object, fields: {perceived: float, received: float, network_size: int}, evidence: strong, note: buffers strain; predicts health and mood}
      health_lifestyle:      {type: object, fields: {exercise: float, diet_quality: float, smoking: bool, alcohol_use: float, preventive_care: float}, evidence: moderate, note: class-patterned bundle (Cockerham)}
      sick_role_status:      {type: enum, values: [none, acute, chronic, caregiver], evidence: moderate}
      chronic_illness_burden: {type: float, range: [0, 1], evidence: strong}
      trait_self_control:    {type: float, range: [0, 1], evidence: strong, note: Gottfredson and Hirschi; Dunedin gradient; predicts rule-breaking and impulsive choice}
      general_strain:        {type: object, fields: {blocked_goals: float, loss_of_valued: float, negative_stimuli: float}, range: [0, 1], evidence: moderate, note: Agnew; strain plus negative affect raises deviance}
      peer_norms:            {type: "list[string]", evidence: strong, note: differential association; what the reference group treats as acceptable}
      labeling_history:      {type: "list[string]", evidence: moderate, note: labels applied by institutions or others that the person may have internalized}
      neutralization_scripts: {type: "list[string]", evidence: moderate, note: 'Sykes and Matza; everyone does it, no one was hurt; predict rationalized violations'}
      turning_points:        {type: "list[object]", item: {event: string, age: int, direction: "enum[toward_conformity, away]"}, evidence: moderate, note: Sampson and Laub life-course}

  constraints_and_rhythms:
    description: Daily rhythm, physiology the person manages, money and time, and how they decide and handle conflict. Social network size lives in social_context.social_support; acute pain lives in state.illness_pain.
    fields:
      chronotype:
        type: enum
        values: [morning, intermediate, evening, unknown]
        instrument: MEQ or MCTQ
        evidence: moderate
        note: mood and performance peak at the person's preferred time (synchrony effect); interacts with situation.time
      sleep_need_hours:
        type: float
        evidence: moderate
        note: personal baseline that state.sleep_hours_last_night is compared against
      usual_schedule:
        type: "list[object]"
        item: {block: string, start: string, end: string, activity: string}
        evidence: strong
        note: routine; the base rate for what they are doing at a given hour (Question 0)
      medications:
        type: "list[object]"
        item: {name_or_class: string, pattern: string, affect_relevant: bool}
        sensitive: true
        entered_by: [user, subject]
        evidence: strong
        note: SSRIs, stimulants, beta blockers, corticosteroids, hormonal contraception and others shift affect, arousal, appetite, or sleep; never inferred
      hormonal_context:
        type: "list[string]"
        sensitive: true
        entered_by: [subject]
        evidence: moderate
        note: optional, subject-entered only (cycle tracking, pregnancy, menopause, hormone therapy); feeds L0 when present
      chronic_pain:
        type: float
        range: [0, 1]
        evidence: strong
        note: standing level; distinct from acute state.illness_pain
      mental_accounts:
        type: "list[object]"
        item: {category: string, monthly_budget: float, spent_fraction: float}
        evidence: strong
        note: people budget by labeled category (Thaler mental accounting); a purchase is judged against its category, not total wealth; feeds situation.constraints.money_slack per category
      time_slack_typical:
        type: float
        range: [0, 1]
        evidence: moderate
      decision_style:
        type: object
        fields: {maximizing: float, intuitive: float, rational: float, dependent: float, avoidant: float, spontaneous: float}
        range: [0, 1]
        instrument: General Decision-Making Style (Scott and Bruce) plus a maximization scale
        evidence: moderate
        note: maximizers search longer and regret more; avoidant and dependent styles predict delay and deference
      conflict_style:
        type: enum
        values: [competing, collaborating, compromising, avoiding, accommodating, unknown]
        instrument: Thomas-Kilmann
        evidence: moderate
        note: default move under disagreement; feeds relationship-schema conflict updates and Track E dynamics
      vocational_interests:
        type: object
        fields: {realistic: float, investigative: float, artistic: float, social: float, enterprising: float, conventional: float}
        range: [0, 1]
        instrument: RIASEC (Holland)
        evidence: strong
        note: interest congruence correlates about 0.32 with performance and predicts persistence (Nye et al. 2017); predicts which activities energize versus drain

  physical:
    description: Body attributes with evidence for feeling or behavior, entered by the user or the subject. Never inferred from photos, video, names, or other fields; the product does no face or body analysis of media. Fields that are only about how a body looks, with no predictive role, are excluded (see excluded_by_policy). For how a character looks in the 2D world, see the avatar spec in docs/21, which is chosen, not measured, and is not a model input.
    fields:
      height_cm:
        type: float
        entered_by: [user, subject]
        evidence: moderate
        note: taller people are on average judged more competent and leader-like and earn somewhat more (verify effect sizes before use); matters for status computations in L3
      weight_band:
        type: enum
        values: [underweight, typical, higher, much_higher, unknown]
        sensitive: true
        entered_by: [subject]
        evidence: moderate
        note: subject-entered only; relevant through weight stigma (stress, avoidance of situations) and health, not appearance
      body_image:
        type: object
        fields: {appearance_satisfaction: float, appearance_anxiety: float}
        range: [0, 1]
        entered_by: [subject]
        evidence: strong
        note: self-reported; predicts shame, social anxiety, and avoidance of being seen (pool, photos, dating) better than any measurement of the body itself
      disability_and_mobility:
        type: "list[string]"
        sensitive: true
        entered_by: [user, subject]
        evidence: strong
        note: shapes capability and opportunity in situation.constraints and which places and routines are accessible
      sensory_impairments:
        type: "list[string]"
        sensitive: true
        entered_by: [user, subject]
        evidence: strong
        note: hearing and vision differences change social interaction (noisy settings, faces at distance) and fatigue
      visible_differences:
        type: "list[string]"
        sensitive: true
        entered_by: [subject]
        evidence: moderate
        note: things the person is self-conscious about, in their own words (a stutter, a scar, a skin condition); predicts self-conscious emotion in exposed situations
      physical_fitness:
        type: float
        range: [0, 1]
        entered_by: [user, subject]
        evidence: moderate
        note: capability for physical activities; exercise frequency lives in social_context.health_lifestyle
    excluded_by_policy:
      - any inference of body, face, or skin attributes from photos or video
      - skin color or complexion as a person attribute (a race proxy; race and ethnicity are self-identified fields)
      - breast, chest, waist, hip, or other body measurements, including cup size
      - attractiveness ratings of the person
      - body shape categories

  self_report_style:
    description: How this person narrates. Lets the model predict stated reasons separately from mechanisms.
    fields:
      verbal_fluency_about_feelings: {type: float, range: [0, 1], evidence: moderate}
      preferred_cover_stories: {type: "list[string]", evidence: moderate, note: e.g. "quality", "principle", "practicality"}
      self_enhancement_bias: {type: float, range: [0, 1], evidence: moderate}

  biology:
    description: Genomic and physiological measurements. Enter only when measured; never inferred from ancestry, appearance, or name. See docs/13-genomic-prediction.md. Expected gain over a rich idiographic profile is small (a few percent of variance) except for the sensory and metabolic preference variants.
    fields:
      ancestry_matches_gwas: {type: bool, evidence: strong, note: polygenic scores are masked when false; portability decays with genetic distance from the discovery sample (Martin 2019)}
      pgs_neuroticism:       {type: float, range: [-3, 3], unit: z, instrument: Nagel 2018 weights, evidence: moderate, note: up to 4.2 percent of variance in-ancestry; deflates within family}
      pgs_wellbeing:         {type: float, range: [-3, 3], unit: z, instrument: Baselmans 2019 weights, evidence: moderate}
      pgs_risk_tolerance:    {type: float, range: [-3, 3], unit: z, instrument: Karlsson Linner 2019 weights, evidence: weak, note: order of 1 to 2 percent}
      pgs_depression:        {type: float, range: [-3, 3], unit: z, evidence: moderate}
      pgs_educational_attainment: {type: float, range: [-3, 3], unit: z, instrument: Okbay 2022 weights, evidence: moderate, note: 12 to 16 percent population; roughly 40 percent smaller within sibships (Howe 2022)}
      taste_bitter_tas2r38:  {type: enum, values: [PAV/PAV, PAV/AVI, AVI/AVI, unknown], evidence: strong, note: bitter sensitivity; vegetable and sweet intake}
      alcohol_aldh2_rs671:   {type: enum, values: [GG, GA, AA, unknown], evidence: strong, note: explains about 29 percent of flushing variance in East Asian samples; shapes drinking}
      caffeine_cyp1a2_rs762551: {type: enum, values: [AA, AC, CC, unknown], evidence: weak, note: coffee intake in European-ancestry samples only}
      lactase_persistence:   {type: enum, values: [persistent, non_persistent, unknown], evidence: strong}
      fto_rs9939609:         {type: enum, values: [TT, TA, AA, unknown], evidence: weak, note: satiety responsiveness; small and mixed in adults}
      cilantro_or6a2:        {type: enum, values: [aversive, neutral, unknown], evidence: weak}
      mc4r_loss_of_function: {type: bool, evidence: strong, note: rare; hyperphagia}
      ctra_index:            {type: float, range: [-3, 3], unit: z, evidence: weak, note: leukocyte pro-inflammatory versus antiviral expression; tracks loneliness and chronic threat (Cole 2014); state not trait}
      cortisol_awakening_response: {type: float, evidence: weak}
      inflammatory_markers:  {type: object, fields: {crp: float, il6: float}, evidence: weak}
      family_history:        {type: "list[string]", evidence: moderate, note: psychiatric and metabolic conditions in first-degree relatives; self-reported}
    excluded_by_policy:
      - single-SNP personality or empathy claims (5-HTTLPR, OXTR rs53576, MAOA, DRD4, COMT); failed replication (Border 2019)
      - methylation of NR3C1 or FKBP5 as an individual predictor; inconsistent direction and confounded by cell composition
      - epigenetic clocks for affect or behavior
      - any genomic inference from ancestry, surname, or appearance

missing_value_policy:
  rule: Never impute a single value. Carry a distribution.
  identity: population marginals for the stated culture and age band
  personality: N(0.5, 0.15) per trait unless text evidence shifts it
  values_and_morals: culture-conditioned priors from World Values Survey and MFQ-2 norms
  history: empty list; model must widen uncertainty, not assume
  state: predict from time of day and situation; report as inferred
  knowledge: assume the person knows what is common knowledge in the situation and nothing else
  goals: infer from situation; flag as inferred
  relations: infer closeness from described interaction; flag as inferred
  biology: absent; population prior unchanged; never inferred
  sensitive_fields: absent unless entered; never imputed, never predicted
  physical: absent unless entered; never inferred from media; height absent means no status adjustment
  constraints_and_rhythms: chronotype intermediate; schedule from time-use base rates for age, occupation, and day type; medications and hormonal context absent unless entered; decision and conflict styles at population means with wide uncertainty
  aptitudes: predicted only above 30 percent coverage; bands with wide uncertainty; numeric range hidden by default
  social_context: population priors by socioeconomic position; strains and norms inferred from notes are proposed, never assumed

minimum_viable_profile:
  description: The smallest profile that still beats a demographic-only baseline, per Park et al. 2024 and Twin-2K-500.
  required: [identity.age, identity.culture, personality.big_five, history.formative_events, goals.active_goals, knowledge.beliefs_about_situation, relations.actors]
