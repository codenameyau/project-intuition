# Open courseware manifest: MIT OpenCourseWare and Harvard free courses.
# Verified 2026-11-08. Project posture: NON-COMMERCIAL (research, education, fun), so CC BY-NC-SA sources are fully usable
# for models and products of this project provided derivatives are shared under CC BY-NC-SA with attribution.
#
# MIT OCW license: CC BY-NC-SA 4.0 (ocw.mit.edu/pages/privacy-and-terms-of-use). OCW's terms state that for AI training,
# attribution must appear in training documentation and in any derivative works. Attribution format: "MIT OpenCourseWare,
# <course number> <title>, <term>, <instructor>, https://ocw.mit.edu/courses/<slug>/, CC BY-NC-SA 4.0".
# Harvard PLL / HarvardX: edX Terms of Service; materials belong to edX, 2U, or the institutions; personal non-commercial use
# within the enrolled course only; no copying beyond that, no redistribution, no derivatives. NOT ingestible. Use as syllabus
# and as courses a human on the team takes; cite publicly available course descriptions only.

version: 0.1.0
ingestion_status: not started; documents only until the owner says to build
posture: non-commercial; all project models and products are released under CC BY-NC-SA-compatible terms

