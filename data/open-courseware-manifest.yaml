ingestion_plan:
  - step: enumerate OCW courses in the five departments with a browser session; confirm slugs in to_verify
  - step: for each course, download the course bundle and the YouTube caption files for lecture videos; keep course number, term, instructor, lecture index, license, and URL on every chunk
  - step: convert lecture notes (PDF) and transcripts to text; align transcripts to lecture topics
  - step: add lecture-level learning objectives to the textbook exam (docs/22 section 4) alongside OpenStax chapters
  - step: build the research retrieval index together with the OpenStax corpus; one attribution record per source as OCW requires
  - step: Harvard courses: record syllabi and descriptions in the curriculum as reading guidance; no content ingestion
  - rule: every model trained on OCW or OpenStax text is released CC BY-NC-SA with the attribution file; the project is non-commercial so this is the default for everything
