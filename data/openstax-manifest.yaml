# OpenStax corpus manifest for the behavioral prediction engine.
# Catalog verified 2026-11-08 against openstax.org (CMS books API, book prefaces) and github.com/openstax (osbooks repositories).
# LICENSE FINDING: every OpenStax textbook preface checked states CC BY-NC-SA 4.0, and OpenStax's licensing help page says
# its textbooks are CC BY-NC-SA. The repository LICENSE file for osbooks-psychology is CC BY-NC-SA 4.0. A few repos carry a
# CC-BY-4.0 SPDX tag (older or translated titles); the preface governs. NonCommercial: no use inside a commercial model or
# product without OpenStax permission (reuse request form). ShareAlike: derivatives, including any released fine-tune that
# contains the text, must be CC BY-NC-SA. Attribution: credit OpenStax, name the book, link to the free version.
#
# "use" values:
#   eval            textbook-exam items and retrieval for research evaluation (allowed)
#   research_ft     fine-tuning for non-commercial research models released CC BY-NC-SA (allowed)
#   commercial      inside Dear You or any paid product or closed model: NOT allowed without permission
#   permission_req  action: submit OpenStax Content Reuse Request before any commercial use

version: 0.1.0
source_format: CNXML modules in osbooks repositories; one collections/<slug>.collection.xml per book lists chapters and module ids; module content in modules/<id>/index.cnxml
conversion: cnxml -> markdown via open converters (e.g. cnxml2md); keep module id, chapter, book, license, and attribution in every chunk
ingestion_status: not started; documents only until the owner says to build

