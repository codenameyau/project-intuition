ingestion_plan:
  - step: clone the osbooks repositories listed (git, pinned commit per book for provenance)
  - step: parse collection.xml for chapter and module order; convert each module cnxml to markdown; strip exercises and review questions unless building the exam
  - step: store chunks with fields [book, chapter, module_id, license, attribution_url, commit]
  - step: build the textbook exam (docs/22 section 4) from chapter learning objectives and key terms, writing new items rather than copying
  - step: build a research retrieval index for engine evaluation and for the appraisal protocol's citations
  - gate: no commercial use (Dear You, closed models, paid products) until OpenStax grants permission via the Content Reuse Request Form; any released fine-tune containing the text is CC BY-NC-SA
